#
# Dependabot: keeps the GitHub Actions used in workflows up to date (security
# patches + version bumps) via automated pull requests.
#
# NOTE: there is intentionally no `npm` ecosystem here. This project ships no
# `package.json` (it's dependency-free, no build step), and Dependabot does NOT
# stay silently dormant for a missing manifest — it runs and FAILS with
# "dependency_file_not_found: /package.json not found", producing a recurring
# red run. Add an `npm` block back only if/when a real `package.json` exists.

version: 2
updates:
  # Keep the actions in .github/workflows/*.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
      - github-actions
    # Group all github/codeql-action steps into ONE pull request. CodeQL
    # requires every `github/codeql-action/*` step in the repo (init, analyze,
    # and upload-sarif — the latter lives in scorecard.yml) to run the SAME
    # version; bumping them in separate PRs leaves a version mismatch that fails
    # the "Analyze JavaScript" check ("Loaded a configuration file for version
    # X, but running version Y"). Grouping makes Dependabot update all three at
    # once so they always stay in lockstep. (This is the fix GitHub's own error
    # message recommends.)
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
