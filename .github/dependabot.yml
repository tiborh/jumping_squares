#
# Dependabot: keeps the GitHub Actions used in workflows up to date (security
# patches + version bumps) via automated pull requests. The npm section is
# included for the future — it stays dormant until a package.json exists.

version: 2
updates:
  # Keep the actions in .github/workflows/*.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
      - github-actions

  # Dormant unless/until a package.json is added.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
    labels:
      - dependencies
