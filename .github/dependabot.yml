#
# Dependabot: keeps the GitHub Actions used in workflows up to date (security
# patches + version bumps) via automated pull requests.
#
# NOTE: there is intentionally no `npm` ecosystem here. This project ships no
# `package.json` (it's dependency-free, no build step), and Dependabot does NOT
# stay silently dormant for a missing manifest — it runs and FAILS with
# "dependency_file_not_found: /package.json not found", producing a recurring
# red run. Add an `npm` block back only if/when a real `package.json` exists.

version: 2
updates:
  # Keep the actions in .github/workflows/*.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
      - github-actions
