#
# OpenSSF Scorecard: assesses the repository's security posture (branch
# protection, token permissions, pinned actions, dangerous workflows, etc.)
# and publishes the results to the Security tab. It also exposes a public
# score you can display as a badge (see README instructions below).

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly (Mondays 07:23 UTC).
    - cron: '23 7 * * 1'
  push:
    branches: [main]

# Top-level: least privilege. The job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to code scanning
      id-token: write          # publish results to the public OpenSSF API
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the score so a badge can display it. Requires the repo to
          # be public (this one is).
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
