#
# Enforces that SPDX copyright headers include the current year. This is the
# safety net behind the local pre-commit hook (.githooks/pre-commit), which can
# be bypassed with --no-verify and does not cover web-UI edits.
#
# On pull requests it checks only the files changed in the PR (so it won't fail
# a PR for pre-existing staleness elsewhere). On pushes to main it checks the
# whole tree.

name: Copyright year

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check copyright year
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need history so we can diff a PR against its base.
          fetch-depth: 0

      - name: Check changed files (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Files changed in this PR relative to the MERGE BASE (three-dot), so
          # advancing `main` doesn't pull in unrelated base-only changes. Passed
          # NUL-delimited so paths with spaces/newlines/globs stay intact and
          # can't be silently skipped (which would let a stale header pass).
          echo "Changed files:"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" |
            tr '\0' '\n'
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" |
            xargs -0 --no-run-if-empty .githooks/check-copyright-year.sh

      - name: Check whole tree (push)
        if: github.event_name == 'push'
        run: .githooks/check-copyright-year.sh
