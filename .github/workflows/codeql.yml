#
# CodeQL: GitHub's static analysis engine. Scans the JavaScript for security
# vulnerabilities and common bugs on push, PR, and a weekly schedule. Findings
# appear in the repository's Security tab (Code scanning alerts).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan (Mondays 06:17 UTC) so newly published rules catch issues
    # even when the code itself hasn't changed.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload scanning results
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript
          # "security-and-quality" adds maintainability/quality queries on top
          # of the default security suite.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:javascript'
