<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Jumping Squares</title>
  <style>
    :root {
      /* Player colours. Extendable: add --p3, --p4 for more players. */
      --p1: #e6484d;
      --p2: #3d7bd6;
      --empty: #2a2d34;
      --grid-gap: 2px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #16181d;
      color: #e8e8ea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      /* Use dynamic viewport height on mobile where available. */
      height: 100dvh;
    }

    #topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: #1e2128;
      border-bottom: 1px solid #2c2f38;
    }

    #turn {
      font-weight: 600;
      font-size: clamp(14px, 3.5vw, 20px);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .turn-dot {
      width: 1em;
      height: 1em;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
    }

    #status {
      font-size: clamp(12px, 3vw, 16px);
      opacity: 0.85;
    }

    /* Small, low-contrast build tag pinned to the bottom-left corner. Visible
       for cache checks (esp. on mobile where the tab title is hidden), but
       deliberately understated and out of the way of the board. */
    #build-tag {
      position: fixed;
      left: 6px;
      bottom: 4px;
      font-size: clamp(10px, 2.4vw, 12px);
      opacity: 0.35;
      letter-spacing: 0.02em;
      white-space: nowrap;
      pointer-events: none; /* never intercept taps meant for the board */
      z-index: 5;
    }

    button {
      font: inherit;
      color: #e8e8ea;
      background: #2c313c;
      border: 1px solid #3a4150;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:active { background: #3a4150; }

    /* Board fills all remaining space and stays centred/square-ish. */
    #board-wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      min-height: 0;
    }

    #board {
      display: grid;
      gap: var(--grid-gap);
      background: #3a3f4b;
      padding: var(--grid-gap);
      border-radius: 10px;
      /* Dimensions set inline by JS to a square that fits the wrap. */
    }

    .cell {
      background: var(--empty);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-color 120ms ease, transform 80ms ease;
      cursor: pointer;
      overflow: hidden;
    }
    .cell.p1 { background: var(--p1); }
    .cell.p2 { background: var(--p2); }
    .cell.playable:hover { filter: brightness(1.12); }
    .cell.bump { transform: scale(0.92); }

    /* Shadow preview (step mode): a cell that WILL change on the next step is
       marked with a pulsing ring + the incoming owner's tint, so the player
       can see where the cascade is about to spread before committing it. */
    .cell.shadow-next::after {
      content: '';
      position: absolute;
      inset: 8%;
      border-radius: 8px;
      border: 2px dashed rgba(255,255,255,0.75);
      animation: shadowPulse 1s ease-in-out infinite;
      pointer-events: none;
    }
    .cell.shadow-p1 { box-shadow: inset 0 0 0 9999px rgba(230,72,77,0.28); }
    .cell.shadow-p2 { box-shadow: inset 0 0 0 9999px rgba(61,123,214,0.28); }
    @keyframes shadowPulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    /* Step-forward button: emphasised while a step is available. */
    #step-btn {
      font-weight: 800;
      background: #2f6bd0;
      border-color: #4d86e0;
      min-width: 44px;   /* comfortable touch target */
    }
    #step-btn:disabled {
      opacity: 0.4;
      cursor: default;
      background: #2c313c;
      border-color: #3a4150;
    }

    /* Pip layout: dots arranged to read like dice, scale with cell size. */
    .pips {
      width: 70%;
      height: 70%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8%;
      place-items: center;
    }
    .pip {
      width: 42%;
      height: 42%;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    /* Overloaded value: a large Arabic numeral that nearly fills the square,
       signalling an unstable cell about to split. Sized relative to the cell. */
    .count {
      color: rgba(255,255,255,0.98);
      font-weight: 800;
      /* Scale with the board: ~64% of a cell, falling back if the var is unset. */
      font-size: calc(var(--cell-size, 40px) * 0.64);
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    /* In step view, an overloaded cell that will change on the next step pulses
       in sync with the shadow ring, tying the number to the preview. */
    .cell.overloaded.shadow-next .count {
      animation: shadowPulse 1s ease-in-out infinite;
    }

    #winner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }
    #winner-overlay.show { display: flex; }
    #winner-overlay .msg {
      font-size: clamp(22px, 7vw, 44px);
      font-weight: 800;
    }

    /* --- Settings overlay ---------------------------------------------------
       A centred, scrollable card over a dimmed backdrop. Sized with clamp()
       and max-height so it works on phones and desktops, portrait or
       landscape (the card scrolls internally if the viewport is very short). */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    #settings-overlay.show { display: flex; }

    #settings-card {
      background: #1e2128;
      border: 1px solid #3a4150;
      border-radius: 14px;
      width: min(92vw, 460px);
      max-height: min(88dvh, 88vh);
      overflow-y: auto;
      padding: clamp(16px, 4vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    #settings-card .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #settings-card h2 {
      margin: 0;
      font-size: clamp(18px, 4.5vw, 24px);
    }
    #settings-close {
      font-size: 18px;
      line-height: 1;
      padding: 6px 12px;
    }

    .setting {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting .setting-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: clamp(13px, 3.4vw, 16px);
      font-weight: 600;
    }
    .setting .setting-value {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #9fd0ff;
      white-space: nowrap;
    }
    .setting .setting-hint {
      font-size: clamp(11px, 2.9vw, 13px);
      opacity: 0.7;
      line-height: 1.35;
    }
    .setting input[type="range"] {
      width: 100%;
      accent-color: #3d7bd6;
      height: 28px;         /* larger touch target for handhelds */
    }
    .setting .range-ends {
      display: flex;
      justify-content: space-between;
      font-size: clamp(10px, 2.6vw, 12px);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div id="turn">
        <span class="turn-dot" id="turn-dot"></span>
        <span id="turn-label">Player 1</span>
      </div>
      <div id="status"></div>
      <button id="step-btn" title="Advance one cascade step" hidden>&gt;</button>
      <button id="settings-btn" title="Settings">⚙ Settings</button>
      <button id="new-game">New Game</button>
    </div>
    <div id="board-wrap">
      <div id="board" role="grid" aria-label="Jumping Squares board"></div>
    </div>
  </div>

  <span id="build-tag" title="Build version (helps confirm you're not on a cached build)"></span>

  <div id="winner-overlay">
    <div class="msg" id="winner-msg"></div>
    <button id="play-again">Play Again</button>
  </div>

  <div id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div id="settings-card">
      <div class="settings-head">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" title="Close settings" aria-label="Close settings">✕</button>
      </div>

      <div class="setting">
        <div class="setting-label">
          <label for="delay-range">Propagation speed</label>
          <span class="setting-value" id="delay-value">Instant</span>
        </div>
        <!-- 12 stops: index 0..10 => 0..1000ms (100ms steps), index 11 => STEP mode. -->
        <input type="range" id="delay-range" min="0" max="11" step="1" value="5" />
        <div class="range-ends">
          <span>Instant</span>
          <span>1000 ms</span>
          <span>&gt; Step</span>
        </div>
        <div class="setting-hint" id="delay-hint">
          How fast a cascade spreads, step by step. Higher = slower (easier to
          follow). At the far end (<strong>&gt; Step</strong>) you advance each
          step manually with a <strong>&gt;</strong> button.
        </div>
      </div>
    </div>
  </div>

  <script src="js/game.js?v=15"></script>
  <script src="js/ui.js?v=15"></script>
</body>
</html>
